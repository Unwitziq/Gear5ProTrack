<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ProTrack">
<meta name="theme-color" id="thc" content="#0e0e0e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>ProTrack</title>
<style>
:root{--sab:env(safe-area-inset-bottom,0px);padding:env(safe-area-inset-top,0px) 0 0}
body{margin:0}
[hidden]{display:none!important}

/* Layout: Telefon-Attrappe links, Tutorial-Coach und Fragebogen rechts; schmal gestapelt mit klebendem Coach. */
:root{
  color-scheme:dark;
  --bg:#0e0e0e; --surface:#161616; --surface2:#1e1e1e; --raised:#262626; --line:#2c2f2e;
  --fg:#f0f0f0; --muted:#aaaaaa; --faint:#767a79;
  --accent:#388e79; --accent-hi:#4db89e; --accent-dim:#0f2a23; --accent-deep:#12332b; --accent-line:#24594c;
  --gold:#f39c12; --warn:#e0a03a; --bad:#d9625a;
  --font:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:15px;line-height:1.45;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}
button:focus-visible,label:focus-within,input:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:minmax(0,390px) minmax(0,1fr);gap:28px;align-items:start}
.side{display:flex;flex-direction:column;gap:20px;min-width:0}
.pagehead{grid-column:1/-1;display:flex;flex-direction:column;gap:4px}
.pagehead h1{font-size:26px;font-weight:900;text-wrap:balance}
.pagehead p{color:var(--muted);max-width:65ch}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700}

.coach{background:var(--accent-dim);border:1px solid var(--accent);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.coach .stepno{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-hi);font-weight:700}
.coach h2{font-size:19px;font-weight:700;text-wrap:balance}
.coach .do{font-weight:600}
.coach .why{color:var(--muted);font-size:14px}
.coach .why b{color:var(--fg);font-weight:600}
.coach .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dots{display:flex;gap:3px;flex:1;min-width:80px}
.dots i{height:4px;flex:1;border-radius:2px;background:#1d4a3f}
.dots i.on{background:var(--accent-hi)}
.btn{background:var(--accent);color:#fff;font-weight:700;border-radius:10px;padding:10px 16px;min-height:44px}
.btn:hover{background:var(--accent-hi)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:600}
.btn.ghost:hover{color:var(--fg);border-color:var(--faint);background:transparent}
.btn.small{min-height:36px;padding:6px 12px;font-size:13px}

.phone{position:relative;width:100%;max-width:390px;height:800px;background:var(--bg);border:1px solid var(--line);border-radius:34px;overflow:hidden;box-shadow:0 0 0 6px #050505,0 20px 60px rgba(0,0,0,.6);justify-self:center}
.scr{position:absolute;inset:0 0 calc(56px + var(--sab)) 0;overflow-y:auto;padding:22px 16px 20px;display:flex;flex-direction:column;gap:14px}
.scr.notab{inset:0;padding-bottom:calc(20px + var(--sab))}
.tabs{position:absolute;left:0;right:0;bottom:0;height:calc(56px + var(--sab));padding-bottom:var(--sab);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--faint)}
.tabs button.on{color:var(--accent-hi)}
.tabs svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:root[data-theme=light]{color-scheme:light;--bg:#f4f4f1;--surface:#ffffff;--surface2:#ecece8;--raised:#dcdcd7;--line:#d6d6d1;--fg:#171717;--muted:#555a58;--faint:#868a88;--gold:#a8660a;--warn:#9a6a14;--bad:#c2463d;--accent-hi:#2c7563;--accent-dim:#dcefe9;--accent-deep:#e4f3ee;--accent-line:#9ccbbd}
[data-theme=light] [stroke="#f0f0f0"]{stroke:#1a1a1a}[data-theme=light] [fill="#f0f0f0"]{fill:#1a1a1a}
[data-theme=light] [stroke="#0e0e0e"]{stroke:#f4f4f1}[data-theme=light] [fill="#0e0e0e"]{fill:#f4f4f1}
[data-theme=light] [stroke="#1e1e1e"]{stroke:#e2e2de}[data-theme=light] [stroke="#2c2f2e"]{stroke:#d0d0cb}
[data-theme=light] [stroke="#3a3d3c"]{stroke:#bdbdb8}[data-theme=light] [fill="#3a3d3c"]{fill:#bdbdb8}
[data-theme=light] .pill.gold,[data-theme=light] .toast{background:#fbefd6}[data-theme=light] .toast{border-color:#e6c680}
[data-theme=light] .pill.warn,[data-theme=light] .wk.dl{background:#f6e9cc}
[data-theme=light] .sw::after{background:#fff}
[data-theme=light] body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:#171717;z-index:99}
.scr>*{flex-shrink:0}
.wkp{display:flex;flex-direction:column}
.wkp>div{display:grid;grid-template-columns:28px 1fr 18px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.wkp>div:last-child{border-bottom:0}
.wkp b{color:var(--faint);font-weight:700}
.wkp>div>span{display:flex;align-items:center;gap:5px;flex-wrap:wrap;min-width:0}
.wkp .now{font-weight:700}.wkp .now b{color:var(--accent-hi)}
.wkp .past{opacity:.45}
.wkp em{color:var(--accent-hi);font-style:normal;font-weight:700;text-align:right}
.hue{-webkit-appearance:none;appearance:none;width:100%;height:30px;border-radius:15px;margin:4px 0;background:linear-gradient(90deg,hsl(0,60%,50%),hsl(60,60%,50%),hsl(120,60%,50%),hsl(180,60%,50%),hsl(240,60%,50%),hsl(300,60%,50%),hsl(360,60%,50%))}
.hue::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:var(--accent-hi);border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.6)}
.hue::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--accent-hi);border:3px solid #fff}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kv b{display:block;font-size:19px}
.pex{font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.pex span{color:var(--muted)}
.pex:first-child{border-top:0}
label.cta{display:grid;place-items:center;cursor:pointer}
.h{font-size:24px;font-weight:900;line-height:1.15}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.card.hero{background:linear-gradient(160deg,var(--accent-deep),var(--surface) 70%);border-color:var(--accent-line)}
button.card:hover{border-color:var(--faint)}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent-hi);border-radius:3px;transition:width .4s}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.num{font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--accent-dim);color:var(--accent-hi)}
.pill.gold{background:#3a2a0a;color:var(--gold)}
.pill.warn{background:#35280f;color:var(--warn)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.cta{background:var(--accent);color:#fff;font-weight:700;font-size:17px;border-radius:12px;min-height:54px;width:100%;flex:none}
.cta:hover{background:var(--accent-hi)}
.cta.line{background:transparent;border:1px solid var(--accent);color:var(--accent-hi)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{background:#3a2a0a;border:1px solid #6b4a0c;color:var(--gold);border-radius:12px;padding:10px 12px;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center}
.avatar{min-width:36px;height:36px;padding:0 10px;border-radius:18px;background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent-hi);font-weight:700;display:grid;place-items:center;font-size:12px}
.linkbtn{color:var(--accent-hi);font-weight:700;font-size:13px;min-height:36px;padding:0 4px}
.back{color:var(--accent-hi);font-weight:700;min-height:40px;text-align:left;align-self:flex-start;padding:0 6px 0 0}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;flex:none}
.ex.open{border-color:var(--accent-line)}
.exhead{width:100%;text-align:left;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px}
.exhead b{font-size:16px}
.exbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.setrow{display:grid;grid-template-columns:22px 1fr 1fr 48px;gap:8px;align-items:center}
.setrow.done{opacity:.5}
.numin{display:flex;align-items:baseline;justify-content:center;gap:4px;background:var(--surface2);border-radius:10px;height:44px;border:1px solid transparent}
.numin:focus-within{border-color:var(--accent-hi)}
.numin input{width:58px;background:transparent;border:0;text-align:right;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;outline:0;-moz-appearance:textfield}
.numin input::-webkit-outer-spin-button,.numin input::-webkit-inner-spin-button{-webkit-appearance:none}
.numin small{color:var(--faint);min-width:26px}
.check{width:48px;height:44px;border-radius:10px;background:var(--accent);display:grid;place-items:center}
.check svg{width:22px;height:22px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.setrow.done .check{background:var(--surface2)}
.preprow{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.preprow:last-child{border-bottom:0}
.preprow.off{opacity:.4}
.tick{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--faint);display:grid;place-items:center;margin-top:2px}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mini{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;margin-top:6px;align-items:center}
.cnt{display:flex;align-items:center;background:var(--surface2);border-radius:10px;height:40px}
.cnt button{width:32px;height:40px;color:var(--muted);font-size:18px}
.cnt b{min-width:38px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px}
.mini .numin{height:40px}.mini .numin input{width:46px;font-size:15px}

.layer{position:absolute;inset:0;background:var(--bg);z-index:4;display:flex;flex-direction:column;align-items:center;padding:26px 18px calc(20px + var(--sab));gap:14px;overflow-y:auto}
.ring{position:relative;width:240px;height:240px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring .t b{font-size:58px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1}
.roundrow{display:flex;justify-content:space-between;width:100%;max-width:300px}
.round{width:76px;height:76px;border-radius:50%;background:var(--surface2);font-weight:600;font-size:14px;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--surface2)}
.round.go{background:var(--accent-dim);color:var(--accent-hi);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent-dim)}
.figure{background:var(--bg);border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;padding:6px;width:100%}
.figure svg{width:180px;height:180px}
.thumb{flex:none;width:52px;height:52px;background:var(--bg);border:1px solid var(--line);border-radius:10px;display:grid;place-items:center}
.thumb svg{width:46px;height:46px}
.wulist{width:100%;display:flex;flex-direction:column;gap:6px}
.wulist div{display:flex;justify-content:space-between;padding:8px 12px;border-radius:10px;background:var(--surface);color:var(--muted)}
.wulist div.now{background:var(--accent-dim);color:var(--fg);font-weight:700}
.wulist div.past{opacity:.45;text-decoration:line-through}
.bigtext{font-size:28px;font-weight:900;text-align:center;text-wrap:balance}

.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:6}
.sheet{background:var(--surface);border-top:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-height:90%;overflow-y:auto;padding:16px 16px calc(16px + var(--sab));display:flex;flex-direction:column;gap:12px}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:600;color:var(--muted);min-height:38px;background:var(--surface);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--accent);background:var(--accent-dim);color:var(--accent-hi)}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700}
.txt{background:var(--surface2);border:1px solid var(--line);border-radius:10px;height:44px;padding:0 12px;width:100%;min-width:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;flex:none}
.seg button{min-height:40px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.list{display:flex;flex-direction:column}
.list>div,.list>button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);min-height:48px;text-align:left;width:100%}
.list>*:last-child{border-bottom:0}
.sw{width:46px;height:28px;border-radius:14px;background:var(--raised);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:left .15s}
.sw.on{background:var(--accent)}.sw.on::after{left:21px;background:#fff}

.grid{display:flex;flex-direction:column;gap:4px}
.grow{display:grid;grid-template-columns:44px repeat(7,1fr);gap:4px;align-items:center}
.grow.head span{font-size:10px;color:var(--faint);text-align:center;text-transform:uppercase;letter-spacing:.06em}
.wk{height:34px;border-radius:8px;background:var(--surface2);font-size:11px;font-weight:700;color:var(--muted)}
.wk.dl{background:#35280f;color:var(--warn)}
.cell{height:34px;border-radius:8px;font-size:10px;font-weight:700;color:#0e0e0e}
.cell{touch-action:none;-webkit-user-select:none;user-select:none}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.strip i{height:8px;border-radius:3px}
.sws{display:flex;gap:8px}
.swc{width:34px;height:34px;border-radius:50%;border:2px solid transparent}
.swc.on{border-color:var(--fg)}
.quest{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.quest:last-child{border-bottom:0}
.quest .bar{grid-column:1/-1}
.quest.done b{color:var(--muted);text-decoration:line-through}
.rank{display:flex;justify-content:space-between;padding:6px 10px;border-radius:8px;color:var(--faint);font-size:13px}
.rank.now{background:var(--accent-dim);color:var(--accent-hi);font-weight:700}

.tut{position:relative;animation:pulse 1.4s ease-in-out infinite;outline:2px solid var(--gold);outline-offset:3px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(243,156,18,.55)}50%{box-shadow:0 0 0 10px rgba(243,156,18,0)}}
@media (prefers-reduced-motion:reduce){.tut{animation:none}}

.survey{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:18px}
.survey h2{font-size:20px;font-weight:900}
.q{display:flex;flex-direction:column;gap:8px;border:0;padding:0;margin:0;min-width:0}
.q legend{font-weight:700;padding:0;margin-bottom:2px}
.q .hint{color:var(--muted);font-size:13px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts label{cursor:pointer}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:block;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;color:var(--muted);font-size:14px}
.opts input:checked+span{border-color:var(--accent);background:var(--accent-dim);color:var(--accent-hi)}
textarea{width:100%;min-height:96px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;resize:vertical}
.note{color:var(--muted);font-size:13px}

@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:16px}
  .side{display:contents}
  .coach{order:1;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:12px;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
  .coach h2{font-size:16px}.coach .why{font-size:13px}
  .phone{order:2;height:720px}
  .survey{order:3}
  .pagehead{order:0}
}
html,body{height:100%}
body{padding:0}
.wrap{display:block;max-width:520px;height:100%}
.pagehead,.side{display:none}
.phone{max-width:none;height:100%;border:0;border-radius:0;box-shadow:none}

html{-webkit-text-size-adjust:100%}
body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
.txt,textarea{font-size:16px}
.wrap{margin:0 auto}
</style>
</head>
<body>
<div class="wrap">
  <header class="pagehead">
    <span class="eyebrow">Gear Five ProTrack · Entwurf 2 für den Umbau</span>
    <h1>Dein Feedback, eingebaut</h1>
    <p>Klickbarer Entwurf mit Beispielwerten, keine echte App. Der gelb pulsierende Rahmen zeigt, was du als Nächstes antippen sollst. Zeiten laufen zehnmal schneller. Am Ende wartet wieder ein Fragebogen.</p>
  </header>
  <div class="phone" id="phone" aria-label="App-Entwurf"></div>
  <div class="side">
    <section class="coach" id="coach" aria-live="polite"></section>
    <section class="survey" id="survey"></section>
  </div>
</div>
<script>

(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var fmt=function(n){return String(Math.round(n*10)/10).replace(".",",")};
var tsd=function(n){return Math.round(n).toLocaleString("de-DE")};
var mmss=function(s){s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
var e1rm=function(w,r){return r<=1?w:w*(1+r/30)};
var CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ---------- Strichfiguren: zwei Posen je Übung, 13 Punkte ---------- */
var BASE={
 f:{hd:[80,26],nk:[80,40],hp:[80,98],sL:[62,48],sR:[98,48],eL:[56,72],hL:[54,94],eR:[104,72],hR:[106,94],kL:[72,128],fL:[70,160],kR:[88,128],fR:[90,160]},
 fs:{hd:[80,26],nk:[80,40],hp:[80,100],sL:[62,48],sR:[98,48],eL:[56,72],hL:[58,94],eR:[104,72],hR:[102,94],kL:[68,112],fL:[66,156],kR:[92,112],fR:[94,156]},

  if(S.gh.pb&&S.set.ghauto&&S.gh.backup)jobs.push(backupPush);
  if(!jobs.length)return;BUSY=true;jobs.reduce(function(a,j){return a.then(j)},Promise.resolve()).then(function(){S.gh.err="";},function(e){S.gh.err=ghErr(e);}).then(function(){BUSY=false;soft();});}

  ghF("GET","repos/"+S.gh.sync+"/contents/").then(function(r){if(!r.ok)ghFail(r);return r.json();}).then(function(list){var fl=list.filter(function(f){return /^status-[a-z0-9-]+\.json$/.test(f.name)&&f.name!==mine});
    return Promise.all(fl.map(function(f){return ghGet(S.gh.sync,f.name).then(function(t){return [f.name,JSON.parse(t)];});}));})
  .then(function(arr){var o={};arr.forEach(function(x){o[x[0]]=x[1];});S.partners=o;S.gh.lastPull=Date.now();S.gh.err="";if(manual)S.gh.msg="";},function(e){S.gh.err=ghErr(e);if(manual)S.gh.msg="";}).then(soft);}

function ensure(){
  var n=S.step;S.sheet=null;S.rest=null;S.wu=null;S.sub=null;S.toast=null;
  var needW=function(){if(!S.prep)initPrep();if(!S.w||!S.w.length){startWorkout();}S.screen="workout";S.open=0;};
  if(n<=1){S.screen="heute";S.done=false;if(!prof().active)S.profile="aufbau";}
  else if(n===2){initPrep();S.screen="prep";}
  else if(n===3||n===4){initPrep();startWorkout();S.wu={left:300,idx:0};}
  else if(n===5||n===7)needW();
  else if(n===6){needW();S.rest={left:90,total:90};}
  else if(n===8||n===11||n===13||n===16)S.screen="heute";
  else if(n===9||n===10){S.screen="mehr";S.sub="game";S.from="heute";if(n===9&&!S.quests.some(function(q){return !q.done}))S.quests.push({t:"Zehn Minuten spazieren",xp:50,done:false});}
  else if(n===12){S.screen="heute";S.sheet={t:"weigh"};}
  else if(n===14||n===15){S.screen="heute";S.sheet={t:"kcal"};}
  else if(n===17||n===21||n===22){S.screen="plan";if(n===17){S.profile="aufbau";if(!prof().active)prof().active="p1";}}
  else if(n>=18&&n<=20){S.profile="aufbau";openEdit(active()||S.plans[0]);}
  else if(n===23||n===24){S.screen="prog";if(!prof().data)S.profile="aufbau";if(n===23)S.prog.range="gesamt";}
}
